name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel an older run when new commits land on the same PR/branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Least privilege: CI only needs to read the code (also safe for fork PRs).
permissions:
  contents: read

env:
  # Dummy values so `next build` and the tests never need real secrets.
  MONGODB_URI: mongodb://127.0.0.1:27017/orbitos-ci
  JWT_SECRET: ci-only-not-a-secret
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  format:
    name: Format (changed files)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Prettier check on files changed by this PR / push
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            BASE_SHA=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
          fi
          git diff --name-only --diff-filter=ACMR "$BASE_SHA"...HEAD \
            | grep -E '\.(js|jsx|ts|tsx|json|md|css|scss|ya?ml)$' > changed.txt || true
          if [ ! -s changed.txt ]; then
            echo "No formattable files changed."
            exit 0
          fi
          echo "Checking:" && cat changed.txt
          xargs -a changed.txt npx prettier --check --ignore-unknown

  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test -- --ci --coverage
      - name: Upload coverage
        if: matrix.node == 20 && always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npm run build
